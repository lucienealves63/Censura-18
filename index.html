      letter-spacing: .045em; text-align: center; text-decoration: none;
      box-shadow: 0 8px 24px #0006; transition: transform .18s ease, background .18s ease;
    }
    .cta:hover { background: #a6572a; transform: translateY(-2px); }
    .cta:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
    @media (max-width: 560px) { main { padding: 0 0 30px; } .page { margin-bottom: 5px; } .cta-wrap { padding: 18px 16px 8px; } .cta { width: 100%; font-size: 15px; } }
